<!-- DOCTYPE - Serve para informar ao navegador que estamos usando o HTML5 -->
<!DOCTYPE html>

<!-- HTML - É a tag principal da página: Tudo relacionado ao HTML fica dentro dela -->
<html lang="pt-br">

<!-- lang/language - É um atributo que serve para configurar/informar o idioma da página. Por padrão, vem configurado como en (English), mas pode ser configurado para o odioma de quem está escrevendo o documento HTML -->

<!-- head/cabeça do documento - Essa área é responsável por guardar informações sobre a página. Chamados de área invisível, pois somente algumas informações ficavam visíveis para o usuário, como por exemplo, o nome da página na aba do navegador, ou a descrição quando o usuário faz alguma coisa. -->

<head>

    <!-- Essa metatag serve para informar ao navegador qual conjunto de caracteres a página utiliza. Isso garante compatibilidade entre sistemas mais antigos, além de exibir de forma correta palavras com acentos e caracteres especiais. -->
    <meta charset="UTF-8">


    <!-- Essa configuração serve para ajudar o navegador a entender como a página deve ser exibida de acordo com o tamanho da tela. Em resumo, ajuda a página a funcionar corretamente em diferentes tamanhos de tela. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title/titulo - Serve paradefinir o título da página que aparece, por exemplo, na aba do navegador -->
    <title>Olá Mundo</title>
</head>

<body>
    Olá Mundo. Este é o meu primeiro programa em HTML5.
</body>

</html>
